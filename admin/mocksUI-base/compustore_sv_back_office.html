        (function() {
            try {
                var saved = localStorage.getItem('compustore_sv_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = (saved === 'dark' || (!saved && prefersDark));
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                var fav = document.getElementById('app-favicon');
                var appleFav = document.getElementById('app-apple-icon');
                var iconPath = isDark ? './logo/icono-bgBlack.png' : './logo/icono-bgWhite.png';
                if (fav) fav.href = iconPath;
                if (appleFav) appleFav.href = iconPath;
            } catch (e) {}
        })();
    </script>

        const CatalogService = Object.freeze({
            filterProducts(products, { category = 'all', search = '', stockFilter = 'all' }) {
                return products.filter(p => {
                    const matchesCategory = category === 'all' || p.category.toLowerCase() === category.toLowerCase();
                    const term = search.toLowerCase().trim();
                    const matchesSearch = !term || 
                        p.name.toLowerCase().includes(term) || 
                        p.id.toLowerCase().includes(term) ||
                        p.brand.toLowerCase().includes(term) ||
                        p.category.toLowerCase().includes(term);
                    
                    let matchesStock = true;
                    if (stockFilter === 'in_stock') matchesStock = p.stock > 0;
                    if (stockFilter === 'low_stock') matchesStock = p.stock > 0 && p.stock <= 3;
                    if (stockFilter === 'out_of_stock') matchesStock = p.stock === 0;
                    if (stockFilter === 'hidden') matchesStock = p.active === false;

                    return matchesCategory && matchesSearch && matchesStock;
                });
            },
            getInventoryMetrics(products) {
                const total = products.length;
                const active = products.filter(p => p.active).length;
                const lowStock = products.filter(p => p.stock > 0 && p.stock <= 3).length;
                const outOfStock = products.filter(p => p.stock === 0).length;
                const totalValuation = products.reduce((acc, p) => acc + (p.price * p.stock), 0);
                return { total, active, lowStock, outOfStock, totalValuation };
            }
        });

                const pending = orders.filter(o => o.status === 'Pendiente' || o.status === 'Confirmado').length;
                const readyForPickup = orders.filter(o => o.status === 'Listo para Retiro').length;
                const delivered = orders.filter(o => o.status === 'Entregado').length;
                const revenue = orders.filter(o => o.status === 'Entregado').reduce((acc, o) => acc + o.total, 0);
                const grossTotal = orders.reduce((acc, o) => acc + o.total, 0);
                return { total, pending, readyForPickup, delivered, revenue, grossTotal };
            }
        });

                const matchedUser = this.state.data.users.find(u => u.role === roleId) || this.state.data.users[0];
                
                // Si la vista actual no está permitida en el nuevo rol, redirigir a la primera vista disponible
                let targetView = this.state.ui.currentView;
                if (!targetRole.allowedViews.includes(targetView)) {
                    targetView = targetRole.allowedViews[0];

                this.state = {

                        isAuthenticated: true,
                        user: matchedUser,
                        role: targetRole

                    ui: {

                        currentView: targetView

                if (!this.state.auth.role.canUpdateStock) {
                    this.showToast("Su rol no tiene permisos para actualizar inventario", "warning");
                    return;
                }
                const updated = this.state.data.products.map(p => {
                    if (p.id === productId) {
                        const newStock = Math.max(0, (p.stock || 0) + delta);
                        return { ...p, stock: newStock };

                    return p;

                this.updateProductsState(updated);

            saveProduct(productData) {
                let updated = [];
                const isEditing = !!productData.id && this.state.data.products.some(p => p.id === productData.id);

                if (isEditing) {
                    if (!this.state.auth.role.canEditProduct) {
                        this.showToast("Permiso denegado para editar productos", "warning");
                        return;

                    updated = this.state.data.products.map(p => p.id === productData.id ? { ...p, ...productData } : p);

                    if (!this.state.auth.role.canCreateProduct) {

                    const newId = `PRD-0${this.state.data.products.length + 1}`.padStart(7, '0');

                        ...productData,
                        id: newId,
                        active: productData.active !== undefined ? productData.active : true,
                        rating: 5.0,
                        specs: productData.specs || []
                    };
                    updated = [newProduct, ...this.state.data.products];
                    this.showToast("Nuevo producto añadido al catálogo", "success");

                this.updateProductsState(updated);
                this.closeModal();

                this.updateProductsState(updated);

                const newId = `ORD-2026-${String(this.state.data.orders.length + 1).padStart(3, '0')}`;
                const newOrder = {

                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),

                const updated = [newOrder, ...this.state.data.orders];

                    data: { ...this.state.data, orders: updated }
                };
                StorageService.save(StorageService.KEYS.ORDERS, updated);
                this.notify();
                this.showToast(`Pedido ${orderId} actualizado a ${newStatus}`, "success");
            }

            // Operaciones de Usuarios / Colaboradores
            saveUser(userData) {
                if (!this.state.auth.role.canManageUsers) {
                    this.showToast("Solo Superadmin puede añadir colaboradores", "warning");
                    return;
                }
                const newId = this.state.data.users.length + 1;
                const newUser = {
                    id: newId,
                    avatar: `https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop&crop=face`,
                    active: true,
                    ...userData
                };
                const updated = [...this.state.data.users, newUser];
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, users: updated }
                };
                this.closeModal();
                this.notify();
                this.showToast(`Colaborador ${newUser.name} añadido`, "success");
            }

            // Operaciones de Categorías
            saveCategory(catData) {
                if (!this.state.auth.role.canCreateProduct) {
                    this.showToast("Su rol no puede añadir categorías", "warning");
                    return;
                }
                const slug = catData.slug || catData.name.toLowerCase().replace(/\s+/g, '-');
                const newCat = {
                    id: slug,
                    slug: slug,
                    ...catData
                };
                const updated = [...this.state.data.categories, newCat];
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, categories: updated }
                };
                this.closeModal();
                this.notify();
                this.showToast(`Categoría "${newCat.name}" agregada`, "success");
            }

            // Operaciones de Ofertas y Promociones
            savePromotion(promoData) {
                if (!this.state.auth.role.canCreateProduct) {
                    this.showToast("Su rol no puede añadir campañas", "warning");
                    return;
                }
                const newId = `PRM-00${this.state.data.promotions.length + 1}`;
                const newPromo = {
                    id: newId,
                    active: true,
                    ...promoData
                };
                const updated = [...this.state.data.promotions, newPromo];
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, promotions: updated }
                };
                StorageService.save(StorageService.KEYS.PROMOTIONS, updated);
                this.closeModal();
                this.notify();
                this.showToast(`Campaña "${newPromo.title}" creada`, "success");
            }

            // Mensajes y Soporte
            markMessageStatus(messageId, newStatus) {
                const updated = this.state.data.messages.map(m => m.id === messageId ? { ...m, status: newStatus } : m);
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, messages: updated }
                };
                StorageService.save(StorageService.KEYS.MESSAGES, updated);
                this.notify();
                this.showToast(`Mensaje marcado como ${newStatus}`, "info");
            }

            // Canales de Venta (Omnicanal)
            toggleChannelActive(channelId) {
                if (!this.state.auth.role.canEditSettings) {
                    this.showToast("Solo Superadmin puede modificar los canales de venta", "warning");
                    return;
                }
                const updated = this.state.data.channels.map(ch => {
                    if (ch.id === channelId) {
                        return { ...ch, active: !ch.active };
                    }
                    return ch;
                });
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, channels: updated }
                };
                StorageService.save(StorageService.KEYS.CHANNELS, updated);
                this.notify();
                const ch = updated.find(c => c.id === channelId);
                this.showToast(`Canal "${ch.name}" ${ch.active ? 'activado' : 'desactivado'}`, "info");
            }

            saveChannel(channelData) {
                if (!this.state.auth.role.canEditSettings) {
                    this.showToast("Solo Superadmin puede gestionar canales de venta", "warning");
                    return;
                }
                const id = channelData.id || channelData.name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                const existingIndex = this.state.data.channels.findIndex(c => c.id === id);
                let updated;
                if (existingIndex >= 0) {
                    updated = [...this.state.data.channels];
                    updated[existingIndex] = { ...updated[existingIndex], ...channelData };
                } else {
                    const newChannel = {
                        id,
                        active: true,
                        badge: channelData.badge || 'Omnicanal',
                        icon: channelData.icon || 'fa-solid fa-store',
                        color: channelData.color || 'blue',
                        description: channelData.description || '',
                        ...channelData
                    };
                    updated = [...this.state.data.channels, newChannel];
                }
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, channels: updated }
                };
                StorageService.save(StorageService.KEYS.CHANNELS, updated);
                this.closeModal();
                this.notify();
                this.showToast(`Canal de venta guardado con éxito`, "success");
            }

            // Transiciones Operativas
            saveOrderStatus(statusData) {
                if (!this.state.auth.role.canEditSettings) {
                    this.showToast("Solo Superadmin puede modificar las transiciones operativas", "warning");
                    return;
                }
                const id = statusData.id || statusData.name;
                const existingIndex = this.state.data.orderStatuses.findIndex(s => s.id === id || s.name === statusData.name);
                let updated;
                if (existingIndex >= 0) {
                    updated = [...this.state.data.orderStatuses];
                    updated[existingIndex] = { ...updated[existingIndex], ...statusData };
                } else {
                    const newStatus = {
                        id,
                        name: statusData.name,
                        step: parseInt(statusData.step, 10) || 1,
                        icon: statusData.icon || 'fa-solid fa-circle-dot',
                        color: statusData.color || 'blue',
                        badgeStyle: statusData.badgeStyle || 'bg-blue-50 text-brand border-brand/30 dark:bg-brand-950/50 dark:text-blue-300 dark:border-brand-800',
                        description: statusData.description || '',
                        nextPossible: statusData.nextPossible || []
                    };
                    updated = [...this.state.data.orderStatuses, newStatus];
                }
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, orderStatuses: updated }
                };
                StorageService.save(StorageService.KEYS.STATUSES, updated);
                this.closeModal();
                this.notify();
                this.showToast(`Estado operativo actualizado`, "success");
            }

            // Exportar Respaldo del Sistema en JSON
            exportBackup() {
                const backupData = {
                    version: "2026.1",
                    exportDate: new Date().toISOString(),
                    settings: this.state.data.settings,
                    products: this.state.data.products,
                    orders: this.state.data.orders,
                    channels: this.state.data.channels,
                    orderStatuses: this.state.data.orderStatuses,
                    categories: this.state.data.categories
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `compustore_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                this.showToast("Snapshot de respaldo exportado exitosamente", "success");
            }

            // Ajustes
            updateSettings(newSettings) {
                if (!this.state.auth.role.canEditSettings) {
                    this.showToast("Solo Superadmin puede modificar los ajustes globales", "warning");
                    return;
                }
                const updated = { ...this.state.data.settings, ...newSettings };
                this.state = {
                    ...this.state,
                    data: { ...this.state.data, settings: updated }
                };
                StorageService.save(StorageService.KEYS.SETTINGS, updated);
                this.notify();
                this.showToast("Ajustes comerciales guardados", "success");
            }

            resetToDefaults() {
                if (!this.state.auth.role.canEditSettings) {
                    this.showToast("Acción restringida", "warning");
                    return;
                }
                localStorage.removeItem(StorageService.KEYS.PRODUCTS);
                localStorage.removeItem(StorageService.KEYS.ORDERS);
                localStorage.removeItem(StorageService.KEYS.CHANNELS);
                localStorage.removeItem(StorageService.KEYS.STATUSES);
                localStorage.removeItem(StorageService.KEYS.MESSAGES);
                localStorage.removeItem(StorageService.KEYS.SETTINGS);

                this.state = {
                    ...this.state,
                    ui: {
                        ...this.state.ui,
                        settingsSubView: 'index'

                    data: {
                        ...this.state.data,
                        products: DEFAULT_PRODUCTS,
                        orders: DEFAULT_ORDERS,
                        channels: DEFAULT_CHANNELS,
                        orderStatuses: DEFAULT_ORDER_STATUSES,
                        messages: DEFAULT_MESSAGES,
                        settings: STORE_CONFIG
                    }
                };
                this.notify();
                this.showToast("Datos de demostración restablecidos de fábrica", "info");
            }

                this.state = {

                    ui: {
                        ...this.state.ui,
                        modal: { isOpen: true, type, data }

                this.notify();

                this.state = {
                    ...this.state,
                    ui: {
                        ...this.state.ui,
                        modal: { isOpen: false, type: null, data: null }

                };
                this.notify();

                this.state = {
                    ...this.state,
                    ui: {

                        confirm: { isOpen: true, title, message, onConfirm, confirmBtnText }

                };

                this.state = {
                    ...this.state,
                    ui: {

                        confirm: { isOpen: false, title: '', message: '', onConfirm: null, confirmBtnText: 'Confirmar' }
                    }

            }

            showToast(message, type = 'success') {
                const root = document.getElementById('toast-root');
                if (!root) return;
                const el = document.createElement('div');
                const colors = {
                    success: 'bg-brand text-white shadow-brand-glow',
                    warning: 'bg-amber-500 text-white',
                    info: 'bg-sidebar text-white border border-white/10',
                    danger: 'bg-red-500 text-white'
                };
                const icons = {
                    success: 'fa-check-circle',
                    warning: 'fa-triangle-exclamation',
                    info: 'fa-circle-info',
                    danger: 'fa-circle-xmark'
                };
                el.className = `${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 fade-in pointer-events-auto transition-all duration-300`;
                el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i> <span>${message}</span>`;
                root.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(10px)';
                    setTimeout(() => el.remove(), 300);
                }, 3200);
            }

            renderConfirmDialog(confirm) {
                return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 fade-in">
                    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-xs" data-action="close-confirm"></div>

                        </div>
                        <h3 class="text-sm font-black text-slate-800 dark:text-slate-100 mb-1.5">${confirm.title}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-5 leading-relaxed">${confirm.message}</p>
                        <div class="flex justify-center gap-2">
                            <button data-action="close-confirm" class="flex-1 px-3 py-2 text-xs font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors cursor-pointer">Cancelar</button>
                            <button data-action="execute-confirm" class="flex-1 px-3 py-2 text-xs font-bold text-white bg-red-500 hover:bg-red-600 rounded-xl shadow-xs transition-colors cursor-pointer">${confirm.confirmBtnText}</button>
                        </div>
                    </div>
                </div>`;
            }
        };

        /* ====================================================================
         * 5. CONTROLLER & EVENT DELEGATION (SINGLE POINT OF INTERACTION)
         * ================================================================== */
        class AppController {
            constructor(store) {
                this.store = store;
                this.root = document.getElementById('app-root');
                this.modalRoot = document.getElementById('modal-root');
                this.init();
            }

            init() {
                // Suscribirse reactivamente al almacén
                this.store.subscribe((state) => this.render(state));

                // Delegación de eventos centralizada
                this.bindEvents();

                // Primer render
                this.render(this.store.getState());
            }

            render(state) {
                if (!state.auth.isAuthenticated) {
                    this.root.innerHTML = LoginViewRenderer.render(state);
                } else {
                    this.root.innerHTML = LayoutRenderer.render(state);
                }
                this.modalRoot.innerHTML = ModalsRenderer.render(state);
            }

            bindEvents() {
                // Eventos de Click
                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;

                    const action = btn.dataset.action;
                    switch (action) {
                        case 'select-role':
                            this.store.loginAsRole(btn.dataset.role);
                            break;
                        case 'logout':
                            this.store.logout();
                            break;
                        case 'navigate':
                            this.store.navigate(btn.dataset.view);
                            break;
                        case 'toggle-sidebar':
                            this.store.toggleSidebar();
                            break;
                        case 'toggle-dark-mode':
                            this.store.toggleDarkMode();
                            break;
                        case 'set-view-mode':
                            this.store.setProductViewMode(btn.dataset.mode);
                            break;
                        case 'filter-cat-and-navigate':
                            this.store.setProductCategory(btn.dataset.category);
                            this.store.navigate('productos');
                            break;
                        case 'filter-orders-status':
                            this.store.setOrderStatusFilter(btn.dataset.status);
                            break;
                        case 'switch-role-quick':
                            if (btn.dataset.role) this.store.loginAsRole(btn.dataset.role);
                            break;
                        
                        // Modales CRUD Dinámicos
                        case 'open-create-product-modal':
                            this.store.openModal('product-form', null);
                            break;
                        case 'open-create-order-modal':
                            this.store.openModal('order-form', null);
                            break;
                        case 'open-create-user-modal':
                            this.store.openModal('user-form', null);
                            break;
                        case 'open-create-category-modal':
                            this.store.openModal('category-form', null);
                            break;
                        case 'open-create-offer-modal':
                            this.store.openModal('offer-form', null);
                            break;
                        case 'open-edit-product-modal': {
                            const p = this.store.getState().data.products.find(x => x.id === btn.dataset.id);
                            if (p) this.store.openModal('product-form', p);
                            break;
                        }
                        case 'view-product-detail':
                            this.store.openModal('product-detail', btn.dataset.id);
                            break;
                        case 'view-order-detail':
                            this.store.openModal('order-detail', btn.dataset.id);
                            break;
                        case 'close-modal':
                            this.store.closeModal();
                            break;
                        
                        // Confirmaciones y Eliminación
                        case 'delete-product-prompt':
                            this.store.openConfirm(
                                'Eliminar Producto',
                                `¿Estás seguro de que deseas eliminar permanentemente <b>${btn.dataset.name}</b> del inventario?`,
                                () => this.store.deleteProduct(btn.dataset.id),
                                'Eliminar'
                            );
                            break;
                        case 'close-confirm':
                            this.store.closeConfirm();
                            break;
                        case 'execute-confirm': {
                            const cb = this.store.getState().ui.confirm.onConfirm;
                            if (cb) cb();
                            this.store.closeConfirm();
                            break;
                        }

                        // Operaciones directas
                        case 'adjust-stock':
                            this.store.updateProductStock(btn.dataset.id, parseInt(btn.dataset.delta, 10));
                            break;
                        case 'mark-message-read':
                            this.store.markMessageStatus(btn.dataset.id, 'Respondido');
                            break;
                        case 'navigate-settings-subview':
                            this.store.setSettingsSubView(btn.dataset.subview);
                            break;
                        case 'toggle-channel-active':
                            this.store.toggleChannelActive(btn.dataset.id);
                            break;
                        case 'open-create-channel-modal':
                            this.store.openModal('channel-form', null);
                            break;
                        case 'filter-orders-and-navigate':
                            this.store.setOrderStatusFilter(btn.dataset.status);
                            this.store.navigate('pedidos');
                            break;
                        case 'view-status-detail':
                            this.store.openModal('status-detail', btn.dataset.status);
                            break;
                        case 'export-backup-json':
                            this.store.exportBackup();
                            break;
                        case 'save-settings': {
                            const name = document.getElementById('setting-name')?.value || this.store.getState().data.settings.name;
                            const email = document.getElementById('setting-email')?.value || this.store.getState().data.settings.email;
                            const address = document.getElementById('setting-address')?.value || this.store.getState().data.settings.address;
                            const phone = document.getElementById('setting-phone')?.value || this.store.getState().data.settings.phones[0];
                            const phone2 = document.getElementById('setting-phone2')?.value || this.store.getState().data.settings.phones[1] || '6838-2232';
                            this.store.updateSettings({
                                name,
                                email,
                                address,
                                phones: [phone, phone2]
                            });
                            break;
                        }
                        case 'reset-defaults-prompt':
                            this.store.openConfirm(
                                'Restablecer Demo',
                                'Esta acción restaurará el catálogo de productos y órdenes a su estado original de fábrica.',
                                () => this.store.resetToDefaults(),
                                'Restablecer'
                            );
                            break;
                    }
                });

                // Inputs y búsquedas con debounce ligero
                document.addEventListener('input', (e) => {
                    const action = e.target.dataset.action;
                    if (action === 'search-products') {
                        this.store.setProductSearch(e.target.value);
                    }
                });

                // Selects y Switches Change
                document.addEventListener('change', (e) => {
                    const action = e.target.dataset.action;
                    if (action === 'filter-category') {
                        this.store.setProductCategory(e.target.value);
                    } else if (action === 'filter-stock') {
                        this.store.setProductStockFilter(e.target.value);
                    } else if (action === 'change-order-status') {
                        this.store.updateOrderStatus(e.target.dataset.id, e.target.value);
                    } else if (action === 'toggle-product-active') {
                        this.store.toggleProductVisibility(e.target.dataset.id);
                    } else if (action === 'switch-role-quick') {
                        this.store.loginAsRole(e.target.value);
                    }
                });

                // Submit de Formularios Reactivos
                document.addEventListener('submit', (e) => {
                    e.preventDefault();

                    // Formulario de Producto
                    if (e.target.id === 'product-form') {
                        const formData = new FormData(e.target);
                        const productData = {
                            id: formData.get('id') || undefined,
                            name: formData.get('name'),
                            category: formData.get('category'),
                            brand: formData.get('brand'),
                            price: parseFloat(formData.get('price')) || 0,
                            originalPrice: formData.get('originalPrice') ? parseFloat(formData.get('originalPrice')) : null,
                            stock: parseInt(formData.get('stock'), 10) || 0,
                            imageUrl: formData.get('imageUrl') || 'https://placehold.co/400x300/f8fafc/0168f5?text=CompuStore+SV',
                            description: formData.get('description') || '',
                            active: e.target.elements['active'] ? e.target.elements['active'].checked : true
                        };
                        this.store.saveProduct(productData);
                    }

                    // Formulario de Pedido / Venta
                    else if (e.target.id === 'order-form') {
                        const formData = new FormData(e.target);
                        const pid = formData.get('productId');
                        const product = this.store.getState().data.products.find(p => p.id === pid);
                        const qty = parseInt(formData.get('quantity'), 10) || 1;
                        const price = product ? product.price : 0;
                        const orderData = {
                            client: formData.get('client'),
                            phone: formData.get('phone'),
                            city: formData.get('city') || 'Cojutepeque',
                            channel: formData.get('channel') || 'Sala de Ventas',
                            paymentMethod: formData.get('paymentMethod'),
                            deliveryMethod: formData.get('deliveryMethod'),
                            status: formData.get('status') || 'Confirmado',
                            total: price * qty,
                            items: [
                                { productId: pid, name: product ? product.name : 'Artículo Informático', quantity: qty, price: price }
                            ]
                        };
                        this.store.saveOrder(orderData);
                    }

                    // Formulario de Usuario / Colaborador
                    else if (e.target.id === 'user-form') {
                        const formData = new FormData(e.target);
                        const userData = {
                            name: formData.get('name'),
                            email: formData.get('email'),
                            role: formData.get('role')
                        };
                        this.store.saveUser(userData);
                    }

                    // Formulario de Categoría
                    else if (e.target.id === 'category-form') {
                        const formData = new FormData(e.target);
                        const catData = {
                            name: formData.get('name'),
                            icon: formData.get('icon') || 'fa-solid fa-folder',
                            description: formData.get('description') || ''
                        };
                        this.store.saveCategory(catData);
                    }

                    // Formulario de Oferta
                    else if (e.target.id === 'offer-form') {
                        const formData = new FormData(e.target);
                        const offerData = {
                            title: formData.get('title'),
                            badge: formData.get('badge') || 'OFERTA ESPECIAL',
                            discountText: formData.get('discountText') || 'DESCUENTO',
                            targetCategory: formData.get('targetCategory') || 'computadoras',
                            description: formData.get('description') || ''
                        };
                        this.store.savePromotion(offerData);
                    }

                    // Formulario de Canal de Venta
                    else if (e.target.id === 'channel-form') {
                        const formData = new FormData(e.target);
                        const channelData = {
                            id: formData.get('id') || undefined,
                            name: formData.get('name'),
                            badge: formData.get('badge') || 'Canal',
                            icon: formData.get('icon') || 'fa-solid fa-store',
                            description: formData.get('description') || '',
                            active: e.target.elements['active'] ? e.target.elements['active'].checked : true
                        };
                        this.store.saveChannel(channelData);
                    }
                });
            }
        }

        // Inicializar Aplicación BackOffice
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new AppController(store));
        } else {
            new AppController(store);
        }

    })();
    </script>
</body>
</html>
